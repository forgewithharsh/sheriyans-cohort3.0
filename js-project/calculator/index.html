<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
}

.calculator {
  width: 340px;
  background: #000;
  border-radius: 35px;
  padding: 20px;
}

.display {
  color: white;
  font-size: 4rem;
  text-align: right;
  padding: 40px 10px;
  min-height: 120px;
  overflow: hidden;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

button {
  height: 70px;
  border: none;
  border-radius: 50%;
  font-size: 1.8rem;
  cursor: pointer;
  background: #333;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.gray {
  background: #a5a5a5;
  color: black;
}

.orange {
  background: #ff9f0a;
}

.zero {
  grid-column: span 2;
  border-radius: 40px;
  text-align: left;
  padding-left: 28px;
}
</style>
<body>

  <div class="calculator">
    <div class="display">0</div>

    <div class="buttons">
      <button class="gray">AC</button>
      <button class="gray">+/-</button>
      <button class="gray">%</button>
      <button class="orange">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="orange">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="orange">−</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="orange">+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button class="orange">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
