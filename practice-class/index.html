<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Practice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
      }

      .container {
        width: 450px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .input-box {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      #add {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #007bff;
        color: white;
      }

      .todo-list {
        list-style: none;
        margin-top: 20px;
      }

      .todo-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        background: #f8f8f8;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      .todo-list span {
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .delete {
        background: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
      }

      .completed span {
        text-decoration: line-through;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>

      <div class="input-box">
        <input type="text" placeholder="Enter a task" />
        <button id="add">Add</button>
      </div>

      <ul class="todo-list">
        <li>
          <span>Learn JavaScript</span>

          <div class="actions">
            <button class="delete">Delete</button>
          </div>
        </li>

        <li class="completed">
          <span>Practice DOM</span>

          <div class="actions">
            <button class="delete">Delete</button>
          </div>
        </li>
      </ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
