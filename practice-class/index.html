<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Practice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
      }

      .container {
        width: 400px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .container h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .input-box {
        display: flex;
        gap: 10px;
      }

      .input-box input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      .input-box button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        cursor: pointer;
      }

      .input-box button:hover {
        background: #0056b3;
      }

      .todo-list {
        list-style: none;
        margin-top: 20px;
      }

      .todo-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8f8f8;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .todo-list .actions {
        display: flex;
        gap: 8px;
      }

      .todo-list button {
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      .complete {
        background: #28a745;
        color: white;
      }

      .delete {
        background: #dc3545;
        color: white;
      }

      .completed {
        text-decoration: line-through;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>

      <div class="input-box">
        <input type="text" placeholder="Enter a task..." />
        <button id="add">Add</button>
      </div>

      <ul class="todo-list"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
